<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Football Showdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="menu-screen" class="overlay visible">
      <div class="menu-panel">
        <div class="badge">UEFA STADIUM</div>
        <h1>3D Football Showdown</h1>
        <p>
          Realistic football action with crowd energy, live decisions, and an all-action
          match experience.
        </p>

        <div class="menu-actions">
          <button id="start-btn" class="primary-btn">Start Match</button>
          <button id="reset-btn" class="secondary-btn">Reset</button>
        </div>

        <ul class="tips">
          <li>Pass into space</li>
          <li>Shot with power</li>
          <li>Cross to the box</li>
          <li>Tackle to win the ball</li>
        </ul>
      </div>
    </div>

    <div id="hud" class="hud hidden">
      <div class="scoreboard">
        <div class="team home">
          <span class="name">HOME</span>
          <span id="home-score" class="score">0</span>
        </div>

        <div class="center-panel">
          <span id="timer">90:00</span>
          <div class="match-status">LIVE</div>
        </div>

        <div class="team away">
          <span class="name">AWAY</span>
          <span id="away-score" class="score">0</span>
        </div>
      </div>

      <div id="controls" class="controls">
        <button data-action="pass" class="action-btn">Pass</button>
        <button data-action="shoot" class="action-btn">Shoot</button>
        <button data-action="cross" class="action-btn">Cross</button>
        <button data-action="tackle" class="action-btn">Tackle</button>
      </div>
    </div>

    <div id="message" class="message hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
